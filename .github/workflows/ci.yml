name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rollback_version:
        description: Previously published R2 version to promote (for example 2.1.11)
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Lint, Type-check & Test (macOS)
    runs-on: macos-15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check byop scripts tests

      - name: Mypy type check
        run: mypy byop

      - name: Pytest
        run: pytest --cov=byop --cov-report=term-missing

  build:
    name: Build distribution
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Make release builds reproducible
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish or roll back release
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && inputs.rollback_version != '' && github.ref == 'refs/heads/master')
    needs: [test, build]
    runs-on: ubuntu-latest
    concurrency:
      group: byop-release-publish
      cancel-in-progress: false
    env:
      BYOP_R2_ENDPOINT: https://80be496e78fc718e84484c4d6ebfc491.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.BYOP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BYOP_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'release'
        with:
          name: dist
          path: dist
      - name: Install release publisher dependency
        run: python -m pip install 'boto3>=1.36,<2'
      - name: Publish release artifacts
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python -c 'import os, re, tomllib; t=os.environ["TAG"]; v=tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", t) and t == "v" + v, "Release tag and package version must match"; print(v)')"
          python scripts/publish_release.py publish "$VERSION" "dist/byop-$VERSION-py3-none-any.whl" install.sh
      - name: Promote an existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.rollback_version }}
        run: python scripts/publish_release.py promote "$VERSION"
